name: CI

on:
  push:
    branches: [main]
  pull_request:

# This repo is public, so forked PRs run this workflow. State the token scope here rather than
# inheriting it from a repo setting: a compromised dev dependency runs during `pnpm install`, and
# nothing in CI needs write access to anything.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config for every later step to read.
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Not the same thing as "it builds". This packs the tarball npm would publish, installs it
      # into a scratch directory, and runs the binary against a real server — the check that would
      # have caught `dist/cli.js` shipping with no shebang, which made the published binary
      # unrunnable and survived every gate in this file for two milestones.
      - name: Package check
        run: node scripts/package-check.ts

      # Workspace rule: zero known vulnerabilities, including low/dev-only.
      - name: Audit
        run: pnpm audit
